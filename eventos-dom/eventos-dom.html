<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <!-- defer: carrega o JS e espera o HTML ser lido antes de executá-lo-->
     <script src="eventos-dom.js" defer></script>
</head>
<body>
    <!-- h1 = títlo principal mostrado na página-->
     <h1>Meu primeiro evento de callback</h1>
     <!-- id identifica o botão para que o js possa encontrá-lo-->
      <button id="btn">Acender luz</button>
      <!-- O JavaScript vai mudar o texto deteste parágrafo no clique.-->
       <p id="status">Luz Apagada</p>
</body>
</html>
